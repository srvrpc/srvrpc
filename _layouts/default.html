<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F86L82QNKZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-F86L82QNKZ');
    </script>

    <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->

    <!-- Open Graph Meta Tags for Social Media -->

    <!-- Twitter Card Meta Tags -->

    <!-- Robots Meta Tag -->

    <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
    <!-- Open Graph -->
    <!-- Twitter Card -->
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="keywords" content="{{ page.keywords }}">
    <meta name="author" content="{{ page.author }}">
    {% if page.canonical %}
    <link rel="canonical" href="{{ page.canonical }}">
    {% else %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}
    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.og_title | default: page.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description }}">
    <meta property="og:url" content="{{ page.og_url | default: page.url | absolute_url }}">
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
    <meta property="og:image" content="{{ page.og_image }}">
    <meta property="og:site_name" content="{{ page.og_site_name | default: site.title }}">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="{{ page.twitter_card | default: 'summary_large_image' }}">
    <meta name="twitter:title" content="{{ page.twitter_title | default: page.title }}">
    <meta name="twitter:description" content="{{ page.twitter_description | default: page.description }}">
    <meta name="twitter:image" content="{{ page.twitter_image | default: page.og_image }}">
    <meta name="twitter:creator" content="{{ page.twitter_creator }}">
    <meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
</head>
<body>
    <header>
        <h1><a href="{{ '/index.html' | relative_url }}">Sreeraman</a></h1>
        <nav>
            <ul>
                <li><a href="{{ '/blog.html' | relative_url }}">Blog</a></li>
                <li><a href="{{ '/music.html' | relative_url }}">Music</a></li>
                <li><a href="{{ '/photographs.html' | relative_url }}">Photographs</a></li>
                <li><a href="{{ '/research.html' | relative_url }}">Research</a></li>
                <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
            </ul>
        </nav>
    </header>
<main>
    {{ content }}
</main>
    <script src="{{ '/js/script.js' | relative_url }}" defer></script>
</body>
</html>
